# Copier template configuration
_min_copier_version: "9.0.0"

# Questions to ask the user
project_name:
  type: str
  help: What is your project name?
  default: "my-tool"

project_slug:
  type: str
  help: Project slug (used for directories and imports)
  default: "{{ project_name.lower().replace('-', '_').replace(' ', '_') }}"

package_name:
  type: str
  help: Python package name
  default: "{{ project_slug }}"

project_description:
  type: str
  help: A short description of your project
  default: "A Python CLI tool"

author_name:
  type: str
  help: Your name
  default: "Your Name"

author_email:
  type: str
  help: Your email
  default: "your.email@example.com"

cli_framework:
  type: str
  help: Which CLI framework do you want to use?
  default: click
  choices:
    - click
    - typer

python_version:
  type: str
  help: Minimum Python version
  default: "3.8"
  choices:
    - "3.8"
    - "3.9"
    - "3.10"
    - "3.11"
    - "3.12"

# Tasks to run after project generation
_tasks:
  - "git init"
  - "git add ."
  - "git commit -m 'Initial commit from template'"

_jinja_extensions:
  - jinja2_time.TimeExtension
